<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoaminAround</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #91aab8;
      }

      #three-world,
      #phaser-ui {
        position: fixed;
        inset: 0;
      }

      #three-world canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #phaser-ui canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .home-link {
        position: fixed;
        z-index: 2;
        top: 24px;
        right: 24px;
        padding: 10px 15px;
        border: 1px solid rgb(255 255 255 / 35%);
        border-radius: 8px;
        background: rgb(20 30 42 / 72%);
        color: white;
        font: 600 14px Arial, sans-serif;
        text-decoration: none;
      }

      .home-link:hover {
        background: rgb(20 30 42 / 92%);
      }
    </style>
  </head>
  <body>
    <div id="three-world"></div>
    <div id="phaser-ui"></div>
    <a class="home-link" href="index.html">All games</a>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <script type="module" src="roaminaround.js"></script>
  </body>
</html>
